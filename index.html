<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>9路盤 次の一手</title>
  <meta name="theme-color" content="#dc9b55">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 74px;
    }
    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #ffffff;
      border-bottom: 1px solid #cbd5e1;
    }
    .app-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #1e293b;
    }
    .tabs {
      display: flex;
      gap: 6px;
    }
    .tab-btn {
      padding: 6px 14px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .info-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .badge-turn {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      background: #0f172a;
      color: #ffffff;
    }
    .badge-turn.white {
      background: #f8fafc;
      color: #0f172a;
      border: 1px solid #94a3b8;
    }
    .board-container {
      width: 100%;
      max-width: 410px;
      background: #dc9b55;
      padding: 8px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    svg.board-svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .board-label {
      font-size: 13px;
      fill: #2e1a09;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .feedback-box {
      width: 100%;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .feedback-box.show { display: flex; }
    .feedback-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .feedback-title {
      font-weight: 800;
      font-size: 1rem;
    }
    .feedback-title.correct { color: #15803d; }
    .feedback-title.wrong { color: #b91c1c; }
    .btn-quick-next {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .sol-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
    }
    .sol-card.active-sol {
      border-color: #15803d;
      background: #ecfdf5;
    }
    .sticky-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #ffffff;
      border-top: 1px solid #cbd5e1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 12px;
      z-index: 100;
    }
    .sticky-nav-inner {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 8px;
    }
    .nav-btn {
      flex: 1;
      height: 42px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
    }
    .nav-btn.primary {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      flex: 1.5;
    }
    .editor-card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
